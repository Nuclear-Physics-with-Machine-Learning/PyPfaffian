[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchpfaff"
version = "0.2.0"
authors = [
  { name="Corey Adams", email="coreyjadams@gmail.com" },
]
description = "A differentiable Pfaffian for PyTorch, with GPU support via Triton."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
triton = ["triton"]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/Nuclear-Physics-with-Machine-Learning/torchpfaff"
Repository = "https://github.com/Nuclear-Physics-with-Machine-Learning/torchpfaff"
Issues = "https://github.com/Nuclear-Physics-with-Machine-Learning/torchpfaff/issues"
Changelog = "https://github.com/Nuclear-Physics-with-Machine-Learning/torchpfaff/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["torchpfaff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
