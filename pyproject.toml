[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-pfaffian"
version = "0.1.0"
authors = [
  { name="Corey Adams", email="coreyjadams@gmail.com" },
]
description = "A differentiable Pfaffian for JAX and PyTorch, with GPU support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
jax = ["jax", "jaxlib"]
torch = ["torch"]
all = ["jax", "jaxlib", "torch"]
test = ["pytest", "numpy", "jax", "jaxlib", "torch"]

[project.urls]
Homepage = "https://github.com/Nuclear-Physics-with-Machine-Learning/PyPfaffian"
Repository = "https://github.com/Nuclear-Physics-with-Machine-Learning/PyPfaffian"
Issues = "https://github.com/Nuclear-Physics-with-Machine-Learning/PyPfaffian/issues"
Changelog = "https://github.com/Nuclear-Physics-with-Machine-Learning/PyPfaffian/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["py_pfaffian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
